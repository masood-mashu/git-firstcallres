name: fcr-eligibility-calculator
version: 1.0.0
description: "Calculates whether a ticket qualifies as First-Call Resolution based on agent message and reopen count"
input_schema:
  type: object
  properties:
    ticket_stats_json:
      type: string
      description: "JSON string containing agent_replies_count and was_reopened (bool)"
  required:
    - ticket_stats_json
implementation:
  type: script
  path: fcr_eligibility_calculator.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
