name: repeat-contact-detector
version: 1.0.0
description: "Detects whether customer created a secondary inquiry within 72 hours of ticket closure"
input_schema:
  type: object
  properties:
    hours_since_closure:
      type: string
      description: "Number of hours elapsed between prior ticket closure and new ticket creation"
  required:
    - hours_since_closure
implementation:
  type: script
  path: repeat_contact_detector.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
