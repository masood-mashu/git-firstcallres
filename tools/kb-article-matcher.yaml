name: kb-article-matcher
version: 1.0.0
description: "Checks if an incoming ticket issue category has an active, verified knowledge base article"
input_schema:
  type: object
  properties:
    issue_category:
      type: string
      description: "Standardized ticket issue category string"
  required:
    - issue_category
implementation:
  type: script
  path: kb_article_matcher.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
